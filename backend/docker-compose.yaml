services:
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4317:4317"

  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LC_ALL: en_US.utf8
      LANG: en_US.utf8
    volumes:
      - pgsql:/var/lib/postgresql

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"

volumes:
  pgsql: